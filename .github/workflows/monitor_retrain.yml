name: Monitor and Retrain

on:
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force candidate retraining for validation only"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 9 * * 1"

jobs:
  monitor-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install evidently==0.7.21
          pip install dvc-s3

      - name: Configure DVC remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote add -f -d dagshub s3://dvc
          dvc remote modify dagshub endpointurl https://dagshub.com/alifa7/MLOps-House-Price-Prediction-v2.s3
          dvc remote modify dagshub --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify dagshub --local secret_access_key "$DAGSHUB_TOKEN"

      - name: Restore DVC artifacts
        run: |
          dvc pull
          test -f models/catboost_model.cbm
          echo "DVC model restored successfully."

      - name: Run drift monitoring
        run: python monitoring/drift_monitor.py

      - name: Run retraining decision
        env:
          FORCE_RETRAIN: ${{ inputs.force_retrain || false }}
        run: python retraining/retrain.py

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monitoring-reports
          path: |
            reports/drift_report.html
            reports/drift_status.json
            reports/retraining_metrics.json
          if-no-files-found: warn
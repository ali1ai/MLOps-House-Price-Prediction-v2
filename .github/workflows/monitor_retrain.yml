name: Monitor and Retrain

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * 1"

jobs:
  monitor-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install evidently==0.7.21

      - name: Run drift monitoring
        run: python monitoring/drift_monitor.py

      - name: Run retraining decision
        run: python retraining/retrain.py

      - name: Upload monitoring reports
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            reports/drift_report.html
            reports/drift_status.json
            reports/retraining_metrics.json
          if-no-files-found: warn
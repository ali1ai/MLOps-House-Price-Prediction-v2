name: Monitor and Retrain

on:
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force candidate retraining for validation only"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 9 * * 1"

jobs:
  monitor-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install evidently==0.7.21

      - name: Run drift monitoring
        run: python monitoring/drift_monitor.py

      - name: Run retraining decision
        env:
          FORCE_RETRAIN: ${{ inputs.force_retrain || false }}
        run: python retraining/retrain.py

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monitoring-reports
          path: |
            reports/drift_report.html
            reports/drift_status.json
            reports/retraining_metrics.json
          if-no-files-found: warn